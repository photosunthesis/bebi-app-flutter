name: Flutter Prepare

inputs:
  flutter_version:
    description: Flutter version
    required: false
    default: "3.47.2"
  firebase_options:
    description: Contents of lib/config/firebase_options.dart
    required: false
  google_services_json:
    description: Contents of android/app/google-services.json
    required: false
  google_service_info_plist:
    description: Contents of ios/Runner/GoogleService-Info.plist
    required: false
  firebase_json:
    description: Contents of firebase.json
    required: false
  install_flutterfire:
    description: Install the FlutterFire CLI, which the iOS Crashlytics build phase needs on PATH
    required: false
    default: "false"
  generate_l10n:
    description: Whether to run flutter gen-l10n
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter_version }}
        cache: true

    - name: Cache Flutter dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: flutter-deps-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          flutter-deps-${{ runner.os }}-

    - name: Write Firebase config files
      shell: bash
      env:
        FIREBASE_OPTIONS: ${{ inputs.firebase_options }}
        GOOGLE_SERVICES_JSON: ${{ inputs.google_services_json }}
        GOOGLE_SERVICE_INFO_PLIST: ${{ inputs.google_service_info_plist }}
        FIREBASE_JSON: ${{ inputs.firebase_json }}
      run: |
        if [ -n "$FIREBASE_OPTIONS" ]; then
          mkdir -p lib/config
          printf '%s\n' "$FIREBASE_OPTIONS" > lib/config/firebase_options.dart
        fi
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        fi
        if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
          printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
        fi
        if [ -n "$FIREBASE_JSON" ]; then
          printf '%s\n' "$FIREBASE_JSON" > firebase.json
        fi

    - name: Install FlutterFire CLI
      if: ${{ inputs.install_flutterfire == 'true' }}
      shell: bash
      run: dart pub global activate flutterfire_cli

    - name: Download dependencies
      shell: bash
      run: flutter pub get

    - name: Run build runner
      shell: bash
      run: flutter pub run build_runner build --delete-conflicting-outputs

    - name: Generate localizations
      if: ${{ inputs.generate_l10n == 'true' }}
      shell: bash
      run: flutter gen-l10n
